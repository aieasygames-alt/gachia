name: Star Rail CMS Integration Verification

on:
  push:
    branches: [codex/starrail-cms-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-next-deferred-patch.mjs --require-patched
      - run: pnpm --filter @gachia/data type-check
      - run: pnpm --filter @gachia/data test
      - run: pnpm --filter @gachia/web type-check
      - run: pnpm --filter @gachia/web test
      - run: pnpm --filter @gachia/data verify:manifests
      - run: pnpm --filter @gachia/web exec opennextjs-cloudflare build
      - run: pnpm --filter @gachia/web exec wrangler deploy --dry-run --env ""
  cms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/payload-cms
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: tools/payload-cms/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm test

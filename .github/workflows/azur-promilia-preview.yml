name: Azur Promilia Worker Preview

on:
  pull_request:
    paths:
      - 'apps/game-azur-promilia/**'
      - 'apps/router/**'
      - 'packages/core/**'
      - 'packages/data/games/azur-promilia/**'
      - 'packages/data/index.ts'
      - 'pnpm-lock.yaml'
      - 'scripts/game-release.mjs'
      - 'scripts/game-release.test.mjs'
      - 'scripts/game-release-smoke.mjs'
      - 'scripts/require-app-runtime.mjs'
      - 'scripts/game-runtime.test.mjs'
      - 'scripts/game-runtime-browser.mjs'
      - 'scripts/runtime-rollout-smoke.mjs'
      - 'scripts/runtime-rollout-smoke.test.mjs'
      - 'scripts/verify-next-deferred-patch.mjs'
      - 'patches/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: azur-promilia-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm --filter @gachia/data type-check
      - run: pnpm --filter @gachia/data validate
      - run: pnpm --filter @gachia/router type-check
      - run: pnpm --filter @gachia/router test
      - run: pnpm --filter @gachia/game-azur-promilia type-check
      - run: pnpm --filter @gachia/game-azur-promilia verify:bundle
      - name: Validate current deployment registry
        run: pnpm validate:game-deployments
      - name: Keep staging routing explicitly disabled
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const router = JSON.parse(fs.readFileSync('apps/router/wrangler.jsonc', 'utf8'));
          assert.equal(router.env.staging.vars.AZUR_PROMILIA_ENABLED, 'false');
          assert.equal(router.env.staging.vars.PREVIEW_MODE, 'true');
          EOF

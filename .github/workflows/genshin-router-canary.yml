name: Genshin Router Canary Verification

on:
  workflow_dispatch:

concurrency:
  group: genshin-router-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-canary:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      GENSHIN_CANARY_TOKEN: ${{ secrets.GENSHIN_CANARY_TOKEN }}
      PLAYWRIGHT_BASE_URL: https://gachia.com
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the protected canary token
        run: test -n "$GENSHIN_CANARY_TOKEN"
      - name: Verify default and Cookie-canary routing
        run: |
          set -euo pipefail
          default_target=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' https://gachia.com/zh/genshin | tr -d '\r' | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
          canary_target=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' -H "Cookie: gachia_genshin_canary=$GENSHIN_CANARY_TOKEN" https://gachia.com/zh/genshin | tr -d '\r' | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
          test -z "$default_target"
          test "$canary_target" = genshin
      - name: Compare production canary with the Main SEO baseline
        env:
          GENSHIN_PRODUCTION_ORIGIN: https://gachia.com
          GENSHIN_STAGING_ORIGIN: https://gachia.com
          GENSHIN_STAGING_COOKIE: gachia_genshin_canary=${{ secrets.GENSHIN_CANARY_TOKEN }}
          GENSHIN_STRICT_PARITY: 'true'
        run: pnpm --filter @gachia/game-genshin seo:parity
      - name: Verify API cache and authorization boundaries
        env:
          GENSHIN_API_ORIGIN: https://gachia.com
        run: pnpm --filter @gachia/game-genshin api:boundary-smoke
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify desktop and mobile canary navigation
        run: pnpm exec playwright test tests/browser/genshin-canary.spec.ts
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: genshin-router-canary-reports
          path: |
            reports/genshin/seo-parity-*.json
            apps/game-genshin/reports/genshin/api-boundary-*.json
            playwright-report
            test-results
          if-no-files-found: warn

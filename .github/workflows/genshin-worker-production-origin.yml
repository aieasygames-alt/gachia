name: Genshin Worker Production Origin

on:
  workflow_dispatch:

concurrency:
  group: genshin-worker-production-origin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:router-config
      - run: pnpm validate:game-deployments
      - run: pnpm --filter @gachia/router type-check
      - run: pnpm --filter @gachia/router test
      - run: pnpm --filter @gachia/game-genshin type-check
      - run: pnpm --filter @gachia/game-genshin verify:bundle
      - name: Confirm production Router routing remains disabled
        run: |
          set -euo pipefail
          test "$(grep -c '"GENSHIN_ENABLED": "false"' apps/router/wrangler.jsonc)" -ge 1
      - name: Deploy production Genshin Worker without Router cutover
        run: |
          set -euo pipefail
          pnpm --filter @gachia/game-genshin run deploy 2>&1 | tee /tmp/genshin-production-deploy.log
          origin=$(sed -nE 's#.*(https://[^[:space:]]+\.workers\.dev[^[:space:]]*).*#\1#p' /tmp/genshin-production-deploy.log | tail -n 1)
          if [ -z "$origin" ]; then
            echo 'Unable to determine Genshin production Worker URL from Wrangler output.' >&2
            exit 1
          fi
          echo "GENSHIN_PRODUCTION_ORIGIN=$origin" >> "$GITHUB_ENV"
      - name: Verify production Worker origin without Router cutover
        run: |
          set -euo pipefail
          : "${GENSHIN_PRODUCTION_ORIGIN:?GENSHIN_PRODUCTION_ORIGIN was not exported by the deploy step}"
          fetch() {
            local path="$1"
            local name="${path//\//_}"
            local status
            status=$(curl --silent --show-error --max-time 30 --dump-header "/tmp/${name}.headers" --output "/tmp/${name}.body" --write-out '%{http_code}' "$GENSHIN_PRODUCTION_ORIGIN/$path") || status=000
            echo "$path: HTTP $status"
            cat "/tmp/${name}.headers" || true
            head -c 2000 "/tmp/${name}.body" || true
            echo
            test "$status" = 200
          }
          fetch robots.txt
          grep -q 'Allow: /' /tmp/robots.txt.body
          ! grep -q 'Disallow: /' /tmp/robots.txt.body
          for path in zh/genshin zh/genshin/characters/hu-tao sitemap.xml; do
            fetch "$path"
            if grep -qi '^x-robots-tag:.*noindex' "/tmp/${path//\//_}.headers"; then
              echo "Unexpected noindex response on production origin: $path" >&2
              exit 1
            fi
          done
          asset=$(sed -nE 's#.*(/_games/genshin/_next/[^" ]+).*#\1#p' /tmp/zh_genshin.body | head -n 1)
          test -n "$asset"
          internal_asset="/_next/${asset#/_games/genshin/_next/}"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$GENSHIN_PRODUCTION_ORIGIN$internal_asset"
      - name: Compare production Worker origin with the Main SEO baseline
        env:
          GENSHIN_STAGING_ORIGIN: ${{ env.GENSHIN_PRODUCTION_ORIGIN }}
          GENSHIN_PRODUCTION_ORIGIN: https://gachia.com
          GENSHIN_STRICT_PARITY: 'true'
        run: pnpm --filter @gachia/game-genshin seo:parity
      - name: Verify anonymous API boundaries remain on the main domain
        env:
          GENSHIN_API_ORIGIN: https://gachia.com
        run: pnpm --filter @gachia/game-genshin api:boundary-smoke
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: genshin-production-origin-reports
          path: |
            reports/genshin/seo-parity-*.json
            reports/genshin/api-boundary-*.json
          if-no-files-found: warn

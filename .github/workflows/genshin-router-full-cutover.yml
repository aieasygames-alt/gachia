name: Retired Genshin Router Full Cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-retired-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - name: Reject obsolete production routing operation
        run: |
          echo 'Retired: Router now serves multiple live owners, not a pre-cutover Genshin-only topology.' >&2
          echo 'Use pnpm release:production plan --targets router and obtain a separately reviewed routing release.' >&2
          exit 1

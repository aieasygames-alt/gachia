name: Enable Genshin Router Canary

on:
  workflow_dispatch:

concurrency:
  group: genshin-router-canary-toggle
  cancel-in-progress: false

jobs:
  enable-canary:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GENSHIN_CANARY_TOKEN: ${{ secrets.GENSHIN_CANARY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Router canary configuration
        run: |
          set -euo pipefail
          test -n "$GENSHIN_CANARY_TOKEN"
          pnpm --filter @gachia/router type-check
          pnpm --filter @gachia/router test
          pnpm validate:game-deployments
      - name: Publish only the Cookie-limited Genshin Router canary
        working-directory: apps/router
        run: |
          set -euo pipefail
          trap 'rm -f wrangler.canary.tmp.jsonc' EXIT
          node -e 'const fs=require("fs"); const source="wrangler.jsonc"; const target="wrangler.canary.tmp.jsonc"; const text=fs.readFileSync(source,"utf8"); const from="\"GENSHIN_ENABLED\": \"false\""; const to="\"GENSHIN_ENABLED\": \"true\""; const next=text.replace(from, to); if(next===text) throw new Error("Expected disabled Genshin production switch"); fs.writeFileSync(target,next);'
          pnpm exec wrangler deploy --config wrangler.canary.tmp.jsonc --env ""
      - name: Confirm default requests remain on Main and token requests use Genshin
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            default_headers=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' https://gachia.com/zh/genshin | tr -d '\r')
            canary_headers=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' -H "Cookie: gachia_genshin_canary=$GENSHIN_CANARY_TOKEN" https://gachia.com/zh/genshin | tr -d '\r')
            default_target=$(printf '%s\n' "$default_headers" | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
            canary_target=$(printf '%s\n' "$canary_headers" | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
            if [ -z "$default_target" ] && [ "$canary_target" = genshin ]; then exit 0; fi
            echo "Attempt $attempt: default=$default_target canary=$canary_target" >&2
            printf '%s\n' "$default_headers" | grep -iE '^(HTTP/|x-gachia-route-target:|content-type:)' >&2 || true
            printf '%s\n' "$canary_headers" | grep -iE '^(HTTP/|x-gachia-route-target:|content-type:)' >&2 || true
            sleep 5
          done
          exit 1

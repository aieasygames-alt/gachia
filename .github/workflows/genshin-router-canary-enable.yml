name: Enable Genshin Router Canary

on:
  workflow_dispatch:

concurrency:
  group: genshin-router-canary-toggle
  cancel-in-progress: false

jobs:
  enable-canary:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GENSHIN_CANARY_TOKEN: ${{ secrets.GENSHIN_CANARY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Router canary configuration
        run: |
          set -euo pipefail
          test -n "$GENSHIN_CANARY_TOKEN"
          pnpm --filter @gachia/router type-check
          pnpm --filter @gachia/router test
          pnpm validate:game-deployments
      - name: Publish only the Cookie-limited Genshin Router canary
        working-directory: apps/router
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const source="wrangler.jsonc"; const target="wrangler.canary.tmp.jsonc"; const text=fs.readFileSync(source,"utf8"); const next=text.replace(/"GENSHIN_ENABLED": "false"/, "\\"GENSHIN_ENABLED\\": \\"true\\""); if(next===text) throw new Error("Expected disabled Genshin production switch"); fs.writeFileSync(target,next);'
          pnpm exec wrangler deploy --config wrangler.canary.tmp.jsonc --env ""
          node -e 'require("fs").unlinkSync("wrangler.canary.tmp.jsonc")'
      - name: Confirm default requests remain on Main and token requests use Genshin
        run: |
          set -euo pipefail
          default_target=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' https://gachia.com/zh/genshin | tr -d '\r' | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
          canary_target=$(curl --silent --show-error --max-time 30 -D - -o /dev/null -H 'X-Gachia-Route-Debug: 1' -H "Cookie: gachia_genshin_canary=$GENSHIN_CANARY_TOKEN" https://gachia.com/zh/genshin | tr -d '\r' | sed -nE 's/^x-gachia-route-target: *(.*)$/\1/ip')
          test -z "$default_target"
          test "$canary_target" = genshin

name: Build, Verify & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gachia-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate game data
        run: pnpm --filter @gachia/data validate

      - name: Build Cloudflare Worker
        run: pnpm --filter @gachia/web exec opennextjs-cloudflare build

      - name: Verify Worker bundle
        working-directory: apps/web
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env ""

      - name: Upload Worker artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true' || vars.CLOUDFLARE_DEPLOY_STAGING_FROM_GITHUB == 'true')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: apps/web/.open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_STAGING_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: apps/web/.open-next

      - name: Verify staging Worker secrets
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --config wrangler.jsonc --env staging --format json > /tmp/worker-secrets.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const configured = new Set(JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8')).map(({ name }) => name));
          const required = ['BETTER_AUTH_SECRET', 'INDEXNOW_AUTH_TOKEN'];
          const missing = required.filter((name) => !configured.has(name));
          if (missing.length) {
            console.error(`Missing staging Worker secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF

      - name: Apply staging D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply gachia-db-staging --remote --env staging --config wrangler.jsonc

      - name: Deploy to Cloudflare staging
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --config wrangler.jsonc --env staging

      - name: Smoke test staging
        run: |
          set -euo pipefail
          origin=https://gachia-staging.aieasygames.workers.dev
          for path in zh en ja sitemap.xml api/auth/get-session; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "${origin}/${path}" > /dev/null
          done

  deploy:
    needs: [build, deploy-staging]
    if: always() && needs.build.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: apps/web/.open-next

      - name: Verify production Worker secrets
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --config wrangler.jsonc --env "" --format json > /tmp/worker-secrets.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const configured = new Set(JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8')).map(({ name }) => name));
          const required = ['BETTER_AUTH_SECRET', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'INDEXNOW_AUTH_TOKEN'];
          const missing = required.filter((name) => !configured.has(name));
          if (missing.length) {
            console.error(`Missing production Worker secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF

      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply gachia-db --remote --env "" --config wrangler.jsonc

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --config wrangler.jsonc --env ""

      - name: Smoke test production
        run: |
          set -euo pipefail
          for url in https://gachia.com/zh https://gachia.com/en https://gachia.com/ja https://gachia.com/sitemap.xml; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "$url" > /dev/null
          done

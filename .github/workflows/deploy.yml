name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # P0 Quality Gates: Type checking before build
      - name: Type Check
        run: pnpm type-check

      # P0 Quality Gates: Tests before build
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # P0 Quality Gates: Database migration for production deployments
      - name: Database Migration
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true'
        run: |
          echo "Running database migrations..."
          # Note: Remote migrations should be applied via wrangler
          # npx wrangler d1 migrations apply gachia-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build Cloudflare Worker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cd apps/web && npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true'
        run: cd apps/web && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true'
        run: |
          set -euo pipefail
          ZONE_ID=$(node --input-type=module -e "const response = await fetch('https://api.cloudflare.com/client/v4/zones?name=gachia.com', { headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN } }); const data = await response.json(); const zoneId = data?.result?.[0]?.id; if (!zoneId) { console.error('Unable to resolve Cloudflare zone ID for gachia.com'); process.exit(1); } process.stdout.write(zoneId);")

          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://gachia.com/","https://gachia.com/zh","https://gachia.com/en","https://gachia.com/ja"]}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

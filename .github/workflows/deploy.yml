name: Verify & Main Worker Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Explicit main Worker release scope (production first validates staging)'
        type: choice
        options: [verify, staging, production]
        default: verify
      production_confirmation:
        description: 'Production only: enter RELEASE_MAIN_ONLY'
        type: string
        default: ''
      rollback_version:
        description: 'Production only: previously active main Worker version UUID, verified by operator'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Serialize releases across refs; never interrupt a deployment in progress.
  group: gachia-${{ github.event_name == 'workflow_dispatch' && inputs.release_target != 'verify' && 'main-release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      web-artifact-id: ${{ steps.web-artifact.outputs.artifact-id }}
      web-artifact-sha256: ${{ steps.seal-web.outputs.sha256 }}
    steps:
      - name: Validate explicit release request
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          CONFIRMATION: ${{ inputs.production_confirmation }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TARGET" = 'production' ]; then
            test "$RELEASE_REF" = 'refs/heads/main'
            test "$CONFIRMATION" = 'RELEASE_MAIN_ONLY'
            [[ "$ROLLBACK_VERSION" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          fi

      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify pinned Next hydration patch
        run: node scripts/verify-next-deferred-patch.mjs --require-patched

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate game data
        run: pnpm --filter @gachia/data validate

      - name: Generate data manifests
        run: pnpm --filter @gachia/data generate:manifests

      - name: Verify data manifests
        run: pnpm --filter @gachia/data verify:manifests

      - name: Build Cloudflare Worker
        run: pnpm --filter @gachia/web exec opennextjs-cloudflare build

      - name: Verify Worker bundle
        working-directory: apps/web
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env ""

      - name: Type check Router
        run: pnpm --filter @gachia/router type-check

      - name: Test Router
        run: pnpm --filter @gachia/router test

      - name: Validate game deployments
        run: pnpm validate:game-deployments

      - name: Generate Router game config
        run: pnpm generate:router-config && git diff --exit-code -- apps/router/src/generated-game-deployments.ts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start web server for browser tests
        run: |
          pnpm --filter @gachia/web dev > /tmp/gachia-web.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/zh > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/gachia-web.log
          exit 1

      - name: Browser navigation smoke tests
        run: pnpm test:browser

      - name: Verify Azur Promilia bundle
        run: pnpm --filter @gachia/game-azur-promilia verify:bundle

      - name: Audit Azur Promilia content
        run: pnpm --filter @gachia/game-azur-promilia audit:content

      - name: Verify Lvmeng bundle
        run: pnpm --filter @gachia/game-lvmeng verify:bundle

      - name: Validate llms.txt
        run: node scripts/validate-llms-route.mjs

      - name: Verify self-contained web artifact
        run: node scripts/verify-worker-artifact.mjs apps/web/.open-next

      # Tar preserves hidden compiled config and pnpm symlinks; upload's zip does not.
      - name: Seal verified web artifact
        id: seal-web
        run: |
          set -euo pipefail
          test -s apps/web/.open-next/worker.js
          test -s apps/web/.open-next/.build/open-next.config.edge.mjs
          tar -C apps/web -czf web-worker.tar.gz .open-next
          echo "sha256=$(sha256sum web-worker.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Store verified web artifact
        id: web-artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-worker-${{ github.sha }}-${{ github.run_attempt }}
          path: web-worker.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.release_target == 'staging' || inputs.release_target == 'production') && vars.CLOUDFLARE_DEPLOY_STAGING_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify pinned Next hydration patch
        run: node scripts/verify-next-deferred-patch.mjs --require-patched

      - name: Download verified web artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.web-artifact-id }}
          path: .release-web
          merge-multiple: true

      - name: Verify and restore web artifact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.web-artifact-sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual=$(sha256sum .release-web/web-worker.tar.gz | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_SHA256"
          test ! -e apps/web/.open-next
          tar -C apps/web -xzf .release-web/web-worker.tar.gz
          test -s apps/web/.open-next/worker.js
          test -s apps/web/.open-next/.build/open-next.config.edge.mjs

      - name: Verify staging Worker secrets
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --config wrangler.jsonc --env staging --format json > /tmp/worker-secrets.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const configured = new Set(JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8')).map(({ name }) => name));
          const required = ['BETTER_AUTH_SECRET', 'INDEXNOW_AUTH_TOKEN'];
          const missing = required.filter((name) => !configured.has(name));
          if (missing.length) {
            console.error(`Missing staging Worker secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF

      - name: Deploy to Cloudflare staging
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec opennextjs-cloudflare deploy --config wrangler.jsonc --env staging 2>&1 | tee /tmp/staging-deploy.log
          origin=$(sed -nE 's#.*(https://[^[:space:]]+\.workers\.dev[^[:space:]]*).*#\1#p' /tmp/staging-deploy.log | tail -n 1)
          if [ -z "$origin" ]; then
            echo 'Unable to determine staging deployment URL from Wrangler output.' >&2
            exit 1
          fi
          echo "STAGING_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Smoke test staging
        run: |
          set -euo pipefail
          : "${STAGING_ORIGIN:?STAGING_ORIGIN was not exported by the deploy step}"
          for path in sitemap.xml api/auth/get-session; do
            url="${STAGING_ORIGIN}/${path}"
            echo "Checking ${url}"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$url" > /dev/null
          done

      - name: Smoke test HI3 reading routes
        env:
          READING_ORIGIN: ${{ env.STAGING_ORIGIN }}
        run: &hi3-reading-smoke |
          set -euo pipefail
          : "${READING_ORIGIN:?Reading origin is required}"
          for lang in zh en ja; do
            for suffix in '' /vermillion-liuli /vermillion-liuli-full-burn /volatile-sparkler; do
              url="${READING_ORIGIN%/}/${lang}/hi3/weapons${suffix}"
              echo "Checking ${url}"
              status=$(curl --silent --show-error --fail --retry 2 --retry-all-errors --retry-delay 2 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
              if [ "$status" != '200' ]; then
                echo "Expected HTTP 200 without redirects, got $status" >&2
                exit 1
              fi
            done
          done

  deploy:
    needs: [build, deploy-staging]
    if: needs.build.result == 'success' && needs.deploy-staging.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.release_target == 'production' && inputs.production_confirmation == 'RELEASE_MAIN_ONLY' && vars.CLOUDFLARE_DEPLOY_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify pinned Next hydration patch
        run: node scripts/verify-next-deferred-patch.mjs --require-patched

      - name: Download verified web artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.web-artifact-id }}
          path: .release-web
          merge-multiple: true

      - name: Verify and restore web artifact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.web-artifact-sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual=$(sha256sum .release-web/web-worker.tar.gz | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_SHA256"
          test ! -e apps/web/.open-next
          tar -C apps/web -xzf .release-web/web-worker.tar.gz
          test -s apps/web/.open-next/worker.js
          test -s apps/web/.open-next/.build/open-next.config.edge.mjs

      - name: Verify production Worker secrets
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --config wrangler.jsonc --env "" --format json > /tmp/worker-secrets.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const configured = new Set(JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8')).map(({ name }) => name));
          const required = ['BETTER_AUTH_SECRET', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'INDEXNOW_AUTH_TOKEN'];
          const missing = required.filter((name) => !configured.has(name));
          if (missing.length) {
            console.error(`Missing production Worker secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF

      - name: Record main deployment before promotion
        working-directory: apps/web
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --config wrangler.jsonc --env "" --json > /tmp/main-deployments-before.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const deployments = JSON.parse(fs.readFileSync('/tmp/main-deployments-before.json', 'utf8'));
          if (!Array.isArray(deployments) || !deployments.length) {
            throw new Error('Missing main deployment history');
          }
          const latest = deployments.toSorted((a, b) => a.created_on.localeCompare(b.created_on)).at(-1);
          if (latest.versions?.length !== 1 || latest.versions[0].percentage !== 100 ||
              latest.versions[0].version_id !== process.env.ROLLBACK_VERSION) {
            throw new Error('Rollback version must match the currently active 100% main version');
          }
          EOF

      - name: Preserve rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: main-deployments-before-${{ github.run_id }}
          path: /tmp/main-deployments-before.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --config wrangler.jsonc --env ""

      - name: Smoke test production
        run: |
          set -euo pipefail
          urls=(
            https://gachia.com/zh
            https://gachia.com/en
            https://gachia.com/ja
            https://gachia.com/zh/genshin
            https://gachia.com/zh/azur-promilia
            https://gachia.com/zh/azur-promilia/characters
            https://gachia.com/zh/azur-promilia/travel-trace
            https://gachia.com/zh/lvmeng
            https://gachia.com/zh/lvmeng/launch-check
            https://gachia.com/zh/privacy
            https://gachia.com/zh/contact
            https://gachia.com/sitemap.xml
            https://gachia.com/sitemaps/azur-promilia/index.xml
            https://gachia.com/ads.txt
          )
          for url in "${urls[@]}"; do
            for attempt in 1 2 3; do
              curl --fail --silent --show-error --max-time 30 "$url" > /dev/null
            done
          done

      - name: Audit production site
        run: pnpm audit:production

      - name: Smoke test HI3 reading routes
        env:
          READING_ORIGIN: https://gachia.com
        run: *hi3-reading-smoke

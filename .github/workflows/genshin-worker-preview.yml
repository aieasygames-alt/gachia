name: Genshin Worker Preview

on:
  workflow_dispatch:

concurrency:
  group: genshin-worker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:router-config
      - run: pnpm validate:game-deployments
      - run: pnpm --filter @gachia/router type-check
      - run: pnpm --filter @gachia/router test
      - run: pnpm --filter @gachia/game-genshin type-check
      - name: Deploy protected Genshin Worker preview
        run: |
          set -euo pipefail
          pnpm --filter @gachia/game-genshin deploy:staging 2>&1 | tee /tmp/genshin-staging-deploy.log
          origin=$(sed -nE 's#.*(https://[^[:space:]]+\.workers\.dev[^[:space:]]*).*#\1#p' /tmp/genshin-staging-deploy.log | tail -n 1)
          if [ -z "$origin" ]; then
            echo 'Unable to determine Genshin staging Worker URL from Wrangler output.' >&2
            exit 1
          fi
          echo "GENSHIN_STAGING_ORIGIN=$origin" >> "$GITHUB_ENV"
      - name: Verify preview crawl protection and basic routes
        run: |
          set -euo pipefail
          : "${GENSHIN_STAGING_ORIGIN:?GENSHIN_STAGING_ORIGIN was not exported by the deploy step}"
          tail_log=/tmp/genshin-worker-tail.log
          pnpm --dir apps/game-genshin exec wrangler tail gachia-game-genshin-staging --config wrangler.jsonc --format pretty > "$tail_log" 2>&1 &
          tail_pid=$!
          cleanup() {
            kill "$tail_pid" 2>/dev/null || true
            wait "$tail_pid" 2>/dev/null || true
            echo 'Genshin staging Worker error log:'
            cat "$tail_log" || true
          }
          trap cleanup EXIT
          for attempt in 1 2 3 4 5; do
            if grep -q 'Connected to gachia-game-genshin-staging' "$tail_log"; then
              break
            fi
            sleep 1
          done
          fetch() {
            local path="$1"
            local name="${path//\//_}"
            local status
            status=$(curl --silent --show-error --max-time 30 --dump-header "/tmp/${name}.headers" --output "/tmp/${name}.body" --write-out '%{http_code}' "$GENSHIN_STAGING_ORIGIN/$path") || status=000
            echo "$path: HTTP $status"
            cat "/tmp/${name}.headers" || true
            head -c 2000 "/tmp/${name}.body" || true
            echo
            if [ "$status" != 200 ]; then
              failures=1
            fi
          }
          failures=0
          fetch robots.txt
          grep -q 'Disallow: /' /tmp/robots.txt.body || failures=1
          for path in zh/genshin zh/genshin/characters/hu-tao; do
            fetch "$path"
            grep -qi '^x-robots-tag:.*noindex' "/tmp/${path//\//_}.headers" || failures=1
          done
          fetch sitemap.xml
          test "$failures" = 0
      - name: Run Genshin SEO parity
        env:
          GENSHIN_STAGING_ORIGIN: ${{ env.GENSHIN_STAGING_ORIGIN }}
          GENSHIN_PREVIEW_ONLY: 'true'
        run: pnpm --filter @gachia/game-genshin seo:parity
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: genshin-seo-parity-report
          path: reports/genshin/seo-parity-*.json
          if-no-files-found: warn

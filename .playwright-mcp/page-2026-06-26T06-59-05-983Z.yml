          - paragraph [ref=e31]: 浪潮汹涌，启航在即。记忆环游海洋开放世界《遗忘之海》公测正式定档7月。
          - paragraph [ref=e32]: 大家热切关注的航海探索大世界，到底潜藏着哪些冒险与机遇，将在6月26日的公测前瞻特别节目中揭晓。届时将首度全方位揭晓公测版本的全部内容，予各位船长奉上航海秘闻。
          - paragraph [ref=e33]:
            - img "SGF+公测定档KV横版FINAL" [ref=e34]
          - heading "夏日启航，赴浪而来！" [level=2] [ref=e35]
          - paragraph [ref=e36]: Make it loud！所有期待，皆有回响！——目前，《遗忘之海》预约通道已全面开启，预约活动持续进行中。各位船长可前往官方各大平台渠道参与预约，成功预约后可领取公测预约礼【“来一杯”银币*20、紫券船员6选1】。
          - paragraph [ref=e37]:
            - img "【品牌字】H74-_494788 SGF PV 封面图中文品牌字-260604" [ref=e38]
          - paragraph [ref=e39]: 参与Joker工作室福利活动，预约《遗忘之海》以及下载《第五人格》，可以同时获得两款游戏的专属头像和周边好礼
          - paragraph [ref=e40]:
            - img "image (19)" [ref=e41]
          - heading "6月26日前瞻直播，公测最新情报抢先看！" [level=2] [ref=e42]
          - paragraph [ref=e43]: 为了不负广大船长的热切盼望，也为让船长们提前熟悉公测版本内容、精准出航，我们将在6月26日开启公测前瞻特别直播。
          - paragraph [ref=e44]: 本次直播将首次全方位揭秘公测内容更新、公测时间安排等核心资讯。除版本内容重磅爆料外也有多种直播福利掉落。
          - paragraph [ref=e45]: 船员与策划皆已就位，只待与各位船长们完成关于这场冒险的交接。
          - paragraph [ref=e46]: 旋律不息，奔赴不止。哪怕是在这片遗忘之海，勇气、热爱、期待......也早似潮汐，化作澎湃而绵长的本能。
          - paragraph [ref=e47]: 勇气作帆，热爱引航，期待与各位船长们在7月公测相遇！
          - paragraph [ref=e48]: 后续我们将持续公布更多公测资讯、福利活动及游戏爆料，敬请船长们关注《遗忘之海》官方社媒，跟进我们的共同冒险。

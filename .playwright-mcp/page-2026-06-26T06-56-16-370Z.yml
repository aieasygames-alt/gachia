                - text: 《遗忘之海》是网易Joker工作室自研的记忆环游海洋开放世界RPG。你将成为一名“脑袋进水"的木偶船长，在海上开启一段自由奇幻、脑洞大开的奇遇之旅。
                - text: 听着，我的船长。
                - text: 在别的地儿，你忙着拯救世界、扬名立万。可在这儿？除了搜刮大海上的金银财宝以外，你还要把丢了的“脑子”找回来。
                - text: 你并不孤单，你的伙伴、那个叫艾丝的机灵鬼，自称天才冒险家。但她口袋里除了一些只会爆炸的奇怪发明，也没比你强多少。因为她跟你一样，也是个把过去忘了个精光的倒霉蛋——显然她自己并不这么想。
                - text: 总之，欢迎你来到《遗忘之海》！

                - generic [ref=e388] [cursor=pointer]: 《异环》是Hotta Studio自主研发的超自然都市开放世界RPG。故事将从海特洛市启篇，作为首位「无证上岗」的「异象猎人」，你将成为接取民间异象委托维持周转的古董店「伊波恩」的一员，与个性迥异、能力非凡的伙伴们一起探索各城市的大小谜团，历经有笑有泪的各式奇遇，演绎独属于你们的都市物语。
                - generic [ref=e389]:
                  - generic [ref=e390]: 供应商 完美世界（北京）互动娱乐有限公司
                  - link "隐私政策" [ref=e391] [cursor=pointer]:
                    - /url: https://www.wanmei.com/safestatic/privacy.html
                    - text: 隐私政策
                    - img [ref=e392]
                  - generic [ref=e394] [cursor=pointer]:
                    - text: 所需权限
                    - img [ref=e395]
              - generic [ref=e397] [cursor=pointer]:
                - generic [ref=e398]:
                  - text: 开发者的话大家好，我们是Hotta Studio工作室《异环》制作组。 作为一款超自然都市开放世界题材游戏，《异环》想要为玩家提供一个熟悉，又稍带陌生的舞台。在这个世界里有长着电视头的海獭，有午夜时分在街头暴走涂鸦的滑板，更有无数超越常识存在之外的异象。当然，你也能结识拥有各种异能的伙伴与搭档，一起解决即将发生的种种事件，逐渐了解并融入这个全新的超自然都市。 关于超自然都市开放世界的设计，我们在开发过程中也有很多感触，有几点是非常想说的。 首先，我们希望这个都市足够真实，所以我们去学习了如何做城市规划。不仅学习现实中的城市，学习已有的游戏设计，也去系统学习了城市规划学。我们希望这是一个“活着”的都市，店铺是有在经营的，街道上的行人车辆要有着各自目的地，街区也看起来是有不同风格和社区氛围的。 其次，我们希望这个都市里有好故事。再好的开放世界游戏也不能缺了好故事，就像“洛圣都”不能失去麦克、老崔和富兰克林。我们将《异环》的故事定义为单元式轻喜剧，致力于呈现生动细腻的剧情演出和性格鲜明的角色形象。最为重要的是，希望通过类番剧的剧情设计，让玩家产生好奇心，维持代入感，激发持续探索的欲望。 最后一个目标，我们还是希望都市的体验能更沉浸。我们希望降低开放世界探索的疲劳感，将重点放在都市生活沉浸感塑造上。我们会用一套都市经营玩法来增加趣味性，你可以通过经营店铺获得资金，再去都市里买车买房，享受一段舒适的生活。 目前，《异环》的开发已经历了一段时间，海特洛市也从无到有搭建了起来，我们想到用一镜到底的方式来做游戏首曝的实机演示，这样也能让你更真实得感受到这个城市，看看这座城市的搭建和生态。未来这个城市还会不断完善，加入更多居民，我们也在编排着这个舞台上会发生的故事。为了达到我们想要的效果，我们这次使用了UE5引擎，同时我们会持续做好多平台优化，让不同平台的玩家都能够获得卓越体验。 感谢每一位看到我们的玩家，欢迎大家来提出建议，指出问题，提供更多好玩的奇思妙想。也欢迎对《异环》感兴趣、与我们目标一致的伙伴，加入Hotta Studio工作室，我们共同让《异环》成为一款好玩的超自然都市开放世界RPG。
                  - generic [ref=e399]: 更多

                    - link "快到50级了，PC端能给4星，移动端只能给3到2星 先说结论：画面很好，但是只有画面很好 优点包括但不限于：城市街景优秀，光追效果极佳；抽卡体验较好，不会歪卡；城市相关交互优秀 存在的缺点包括但不限于：优化糟糕、输入延迟、无意义社交、玩法糟糕、角色塑造一般、剧情一般、本应作为核心的都市玩法没得到强化，还是在搞二游老一套的东西、后期材料获取困难 画面可以说是迄今为止最好的二游没有之一，甚至可以胜过同年的3A，光凭这一点就能给4颗星，换句话说除此以外的内容简直是一塌糊涂 比如游戏内的环石、方斯、甲硬币，环石缺，方斯缺，甲硬币更缺，比其他二游多一个方斯要肝，体验非常糟糕 肝度巨大，都市活力+粉爪大劫案+传统深渊玩法，压力巨大，这些还不算养成材料的获取45级以后压力巨大。同时都市玩法里的钓鱼玩法相关奖励、粉爪大劫案的粉爪币获取难度非常高，需求的量非常大。 玩法糟糕，都市玩法里的玩法又无聊又肝，呗果神人社交玩法，黑暗赛车体验极差，委托里一个校园一个医院两个神人委托，光校园一个委托就能打一下午。同时还要在各个地方塞恐怖元素，简直是神人了，又是恐怖又是解密还巨难我为什么不去玩生化危机？我要玩你异环？而且还是那个问题，都市游戏不好好搞都市还在搞老一套二游里的那些糟粕玩法 一般向游戏爆改男性向，结果纯擦，服装设计角色设计拉完了 PC端硬件调度也存在异常，以及优化差三天两头闪退也不提了 反正总体而言未来可期，苏幻赶工期匆匆上架，不好好优化还是要完蛋的游戏" [ref=e561]:

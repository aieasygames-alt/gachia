            - generic [ref=e302]:
              - link "剧情" [ref=e304] [cursor=pointer]:
                - /url: /tag/%E5%89%A7%E6%83%85
              - link "二次元" [ref=e306] [cursor=pointer]:
                - /url: /tag/%E4%BA%8C%E6%AC%A1%E5%85%83
              - link "角色扮演" [ref=e308] [cursor=pointer]:
                - /url: /tag/%E8%A7%92%E8%89%B2%E6%89%AE%E6%BC%94
            - generic [ref=e311]:
              - generic [ref=e312]:
                - generic [ref=e314] [cursor=pointer]:
                  - text: 《归环》是一款全新的时间循环开放世界游戏。作为预言中的「归还者」，你将携手神秘的使灵「初」，不断迈入死亡回归的循环，行走于时间之外，寻找打破结局的方法；于一次次溃败之中破局重生，设法逆转各国发生的悲剧，拯救世界于末日前，改变既定的命运……
                  - text: ———————————————— 世 界 的 一 隅 逐 渐 被 揭 晓 ——————————————
                  - text: 亿万次日落，终将点亮一次曙光！新的循环即将开启，欢迎来到时间之外！
                  - text: 【执掌时间之梭，骰定故事走向】
                  - text: 在亚达尔大陆的旅程中，存在着无数暗藏玄机...
                - generic [ref=e316]:
                  - generic [ref=e317]: 供应商 萨罗斯网络科技（深圳）有限公司
                  - link "隐私政策" [ref=e318] [cursor=pointer]:
                    - /url: https://rule.sarosgame.com/sarosis/20260113/l6/pp.html
                    - text: 隐私政策
                    - img [ref=e319]
              - generic [ref=e321] [cursor=pointer]:
                - generic [ref=e322]:
                  - text: 开发者的话大家好，我们是《归环》项目组。 自《归环》首次亮相以来，我们收到了许多玩家真诚的期待与建议。每一份关注，都让我们既坚定了目标，又感到有些惶恐——我们无比渴望能与你共同走进这个由「时间循环」与「开放世界」元素交织而成的舞台，却又常因担心它尚未达到期待而惴惴不安。正是来自你们的那些声音，在鞭策着我们不断前行。 在叙事设计上，我们注意到一些玩家和媒体曾对我们的内容方向产生「二次元博德之门」的联想。这让我们既兴奋又忐忑：兴奋的是能被与如此杰出的作品并列提及，忐忑的是我们深知自己仍需在叙事表达上进一步摸索。我们非常清楚，自己的内容与杰作之间仍存在着相当的差距。目前，《归环》正在尝试构建的是一种「主干清晰、枝节丰茂」的叙事框架，我们希望能在叙事的深度与选择的重量之间，找到一种和谐的共鸣。使你做出的不同抉择，能够随着掷出的骰子，在旅途中呈现不同的风景，也让它们在你所经历的故事中，成为值得回味的片段。 在我们看来，角色不光是故事的载体，更是玩家锚定情感、串联彼此共鸣的核心。从项目首次曝光起，我们认真阅读了大家对于角色的每一条看法。这些建议指引、帮助着我们，让我们在持续打磨已有角色的同时，也对新角色倾注了更多心血——从发型细节到整体服造，都经过了更细致的推敲，力求让他们的形象更具辨识度。我们深知，要塑造真正深入人心的角色无法一蹴而就，这既需要持续的优化，也离不开长期的投入。我们期待，在未来的旅程中，他们能以更让人眼前一亮的姿态，成为值得你喜爱的同伴。 我们希望打造的「亚达尔大陆」，是剧情流动的舞台、情感生长的土壤。为此，我们也在为更好的场景的视觉表现、更生动的氛围营造不断努力——从古老遗迹的光影流转，到城内街巷的烟火气息，我们都会做出优化，以期能够让你在探索世界时，自然而然地沉浸在《归环》独特的幻想风情之中。 在战斗与养成方面，「人灵协战」的特色体验是我们希望呈现的核心亮点。角色将与使灵并肩作战、共同协作，带来多种不同形式的组合表现。我们将通过提供多流派的战术玩法，结合可以自由搭配的「万相卡」系统，带来更多种战斗风格的可能性，让战术策略的乐趣，从即时的操作延伸至战前的流派组合与战法构筑。另外，在首次亮相后，我们也看到了许多对战斗打击感的讨论与建议。基于这些宝贵的反馈，我们集中优化了战斗的受击动作与特效，希望为你带来更具质感的体验。 我们知道，将「时间循环」的设定与「开放世界」的结构做结合是一次极富挑战的尝试。在叙事与生态感染力的提升上，我们仍有很长的路要走。因此，我们更加渴望能持续倾听你的声音，在你的关注与陪伴下，持续打磨、共同成长——努力让你在亚达尔的旅程充实、美好，也让《归环》为你带来多一份真实与触动。 感谢每一位愿意为我们驻足的你。归环之内，时间可逆，但我们与你的相遇不可重来。我们期待与你一起，在循环中寻找突破，在命运中写下属于自己的篇章。
                  - generic [ref=e323]: 更多

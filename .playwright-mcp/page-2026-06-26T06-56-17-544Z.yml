                      - /url: /review/48920085
                      - generic [ref=e638]:
                        - text: 写了一堆一俩千字测评结果接了个电话没了……
                        - text: 不想写了简单说一下吧！
                        - text: 一，指引任务不够完善，很多任务特别是转职前置一堆人找不到，结果研究半天要先做地图里面另外一个任务，而指引里面不说直接给你拉到任务点没做前置不触发。
                        - text: 二，玩法没啥好说的啥都抄了，背景缝合了跑团，海贼王，人物抄他们自己家的第五人格木偶风，整体游戏文化偏暗黑系！
                        - text: 三，转职和职业搞的有点太过烦琐让我梦回暗黑破坏神的技能点，想搞差异化反而让新玩家更难入手，我这种身经百战的老玩家（不吹牛说，百分之九十手游，百分之五十端游我都玩过）刚入手的时候都感觉头皮发麻，而搞得这么麻烦之后其实效果是一样的～
                        - text: 四，游戏收益太低，这游戏核心只有就俩个，大脸币和氪金币（氪金币和送的币都也只能抽卡统一叫氪金币）每天主要获取大脸币方式就是宝藏，地图任务和宝箱收益和付出比例完全不对等，一个海岛（其他游戏一章内容）的收益只够你三四抽，大脸币的话连一个专武五级强化都点不起。后续不改必暴毙。
                        - text: 五，抽卡方面，老三样，八十保底，up池，标准池，专武池，还有一个服装池（服装就是炫酷dzt那种加成一点没有，主打一个帅）
                        - text: 六，战斗方面重点多了一个摇骰子，这个骰子可以分三个方面讲，一个是判定模式，高于多少成立低于多少失败（跑团玩法）
                        - text: 第二个是a小怪进入（第三下打小怪才算，如果速度快的小怪可以提前空a俩下，这里有点像怪猎
                        - img "[表情_吃瓜]" [ref=e639]
                        - text: ）这个模式分三个区块，一个加速，一个加速降低对面buff，一个造成群体伤害，数值只是高低没区别只是锁定判定区块，
                        - text: 第三个是站内都摇骰子，要用火，类似于yys攒技能放大招，不过这个游戏是攒火加强技能，全职业所有技能都能用，刚玩不懂我5级单挑12级boss就是靠骰子加强奶量硬刮死boss，（比如正常伤害是100，摇骰子12点就是100*12=1200伤害换其他的奶量，盾量都是一样机制）这个玩法适合手搓党，打排行！还有平民玩家过剧情，不会出现那种彻底卡死的情况！
                        - text: 战斗画风也不错。而且当你属性碾压的情况下不会进入回合，而是第三下a怪直死（这游戏重点判定都是第三下）
                        - text: 七，主城玩法还是比较贫瘠，目前主要还是收邮件（宝藏）卖，强化（破屋），职业导师，像什么老金和船场我都懵逼的，每日任务要买，引导任务做完给你十点，每日任务卷卖十点，做完每日任务在给你十点～合着就赚个升级经验呗，商店那些东西不是买的，而是看的？
                        - text: 基本就这些东西，刚才会写的比较详情现在不想组织语言了，想到哪里写到哪里，然后看到这里基本都是想玩的，老登给你爆焚决，
                        - text: 进游戏重点做主线一路做，其他别管，到五级看看攻略转第一次职业不用纠结，五级，十级专职都是二阶，所二阶职业你可以转俩个前期先转要求低的，
                        - text: 不要像我五级去打十二级大螃蟹被打的跟玩魂系一样，第二次专职也就是十级这时候要开始做支线任务，到时候公测会有攻略跟着攻略走，
                        - text: 等主线做完开始回头清支线，这个游戏阴间地方很多，boss藏的很深，很多都要做支线才能解锁区域，制药那玩意不用去凹，经验度到能自动炼制就行了
                        - text: 注意！！！画重点！！！第一周要最快速度打到美人鱼通关浅层三层梦境，解锁一周一次的白嫖活动（可以嫖一个紫或者金卡，三周保底金）平民玩家玩下去的最大动力
                        - img "[表情_吃瓜]" [ref=e640]
                        - text: 资源抽卡只抽up池，平民玩家可以攒着等第二个up池，我估计公测一个月或者半个月更新一次，这样能拿一个保底，强调，这个游戏三测很多攻略说专武没用，实测想大嘴巴抽他们，1-0比4-强，你如果要哪一个角色，资源预算俩抽保底最好，一个角色，一个专武！
                        - text: 然后就这样了感觉没啥了！方便给我点点赞，回头公测在更新一下，好久没发帖子了！嘴替玩家都没更新了！

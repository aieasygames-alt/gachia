        - generic: 《鸣潮》适龄提示
        - generic:
          - generic: 1.本游戏是一款开放世界动作游戏。适用于年满16周岁以上的用户，建议未成年人在监护人的监护下使用游戏产品。
          - generic: 2.本游戏基于架空的故事背景和世界观，与真实历史和现实世界均无任何关联。
          - generic: 3.根据国家相关要求，本游戏中有用户实名认证系统，未通过实名认证的用户不可进入游戏；游戏中部分玩法和道具需要付费。认证为未成年的用户将受到以下游戏限制： 未满8周岁的用户不能充值；8周岁以上未满16周岁的未成年用户，单次充值金额不得超过50元人民币，每月充值金额累计不得超过200元人民币；16周岁以上的未成年用户，单次充值金额不得超过100元人民币，每月充值金额累计不得超过400元人民币。游戏仅会在周五、周六、周日和法定节假日的20时至21时，向未成年人提供1小时游戏服务。
          - generic: 4.游戏中设置了主线、支线剧情，并且提供了开放世界探索玩法。游戏内有丰富多彩的剧情，精美的游戏画面，优质的游戏配音以及新颖的系统玩法。

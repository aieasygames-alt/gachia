name: gachia-cms-editor
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms_editor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CMS_PG_ADMIN_PASSWORD:?Set an independent PostgreSQL administration password}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:?Set a random hexadecimal CMS_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-cms.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d cms_editor']
      interval: 5s
      timeout: 5s
      retries: 20
  cms:
    build:
      context: ../../..
      dockerfile: services/content-cms/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CMS_MODE: editor
      CMS_SERVER_URL: ${CMS_SERVER_URL:?Set the HTTPS origin}
      CMS_DATA_DIR: /var/lib/payload
      CMS_DATABASE_TLS: disable
      DATABASE_URL: postgres://cms_editor:${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD}@postgres:5432/cms_editor
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set an independent random PAYLOAD_SECRET}
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - media:/var/lib/payload
    stop_grace_period: 30s
volumes:
  postgres:
  media:
